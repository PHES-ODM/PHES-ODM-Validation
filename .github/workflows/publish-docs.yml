name: Generate docs and push to Github Pages
on:
  push:
    branches:
    - main
    paths:
    - '*.md'
    - '.github/**'
    - 'INSTALL'
    - 'LICENSE'
    - 'assets/**'
    - 'docs/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
      with:
        python-version: '3.9'
    - uses: nikeee/setup-pandoc@96d7406a408cae3f939dfe9222420c5b9ff9cfbb # v1
    - uses: quarto-dev/quarto-actions/setup@9e48da27e184aa238fcb49f5db75469626d43adb # v2
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      with:
        fetch-depth: 0
    - name: Install python dependencies
      run: |
        pip install -r requirements.txt
        pip install -r docs/requirements.txt
        pip install .
    - name: Render Quarto docs
      run: python src/odm_validation/tools/render_quarto_docs.py
    - name: Build and Commit
      uses: sphinx-notes/pages@740f210a7f20fca982a77caad4e7f1b5d202bb1f # v2.1 # requires checkout with `fetch-depth: 0`
      with:
        documentation_path: docs
        target_branch: gh-pages
    - name: Set GH-Pages domain name
      run: echo 'validate-docs.phes-odm.org' > ${{ github.workspace }}/CNAME
    - name: Commit CNAME file
      run: |
        git add CNAME
        git commit -m "Add CNAME"
    - name: Push to GitHub Pages
      uses: ad-m/github-push-action@40bf560936a8022e68a3c00e7d2abefaf01305a6 # v0.6.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: gh-pages
