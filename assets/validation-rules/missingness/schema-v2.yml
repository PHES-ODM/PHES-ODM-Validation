schemaVersion: '2.0.0'
schema:
  sites:
    type: list
    schema:
      type: dict
      schema:
        siteID:
          missingness:
            allowed: []
            forbidden:
            - NA
            - nan
            - nr
          meta:
          - ruleID: missingness
            meta:
            - partID: siteID
              sites: pK
              sitesRequired: mandatory
              missingnessSet: genMissingnessSet
            - partID: NA
              partType: missingness
            - partID: nan
              partType: missingness
            - partID: nr
              partType: missingness
        geoLat:
          missingness:
            allowed:
            - NA
            - nr
            forbidden: []
          meta:
          - ruleID: missingness
            meta:
            - partID: geoLat
              sites: header
              sitesRequired: mandatory
              missingnessSet: nrNAMissingnessSet
            - partID: NA
              setID: nrNAMissingnessSet
            - partID: nr
              setID: nrNAMissingnessSet
        country:
          missingness:
            allowed:
            - nr
            forbidden: []
          meta:
          - ruleID: missingness
            meta:
            - partID: country
              sites: header
              sitesRequired: optional
              missingnessSet: nrMissingnessSet
            - partID: nr
              setID: nrMissingnessSet
      meta:
      - partID: sites
        partType: tables
  samples:
    type: list
    schema:
      type: dict
      schema:
        siteID:
          missingness:
            allowed:
            - NA
            - nan
            - nr
            forbidden: []
          meta:
          - ruleID: missingness
            meta:
            - partID: siteID
              samples: fK
              samplesRequired: optional
              missingnessSet: genMissingnessSet
            - partID: NA
              setID: genMissingnessSet
            - partID: nan
              setID: genMissingnessSet
            - partID: nr
              setID: genMissingnessSet
      meta:
      - partID: samples
        partType: tables
