name: flake8 Lint

on: [pull_request]

jobs:
  flake8-lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: Check out source repository
        uses: actions/checkout@f43a0e5 # v3
      - name: Set up Python environment
        uses: actions/setup-python@7f4fc3e # v4
        with:
          python-version: '3.9'
      - name: flake8 Lint
        uses: py-actions/flake8@84ec672 # v2
        with:
          path: "src tests"
          max-line-length: "80"
